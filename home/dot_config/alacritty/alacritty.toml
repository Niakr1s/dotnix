[window]
padding = { x = 10, y = 10 }
dynamic_padding = false
# opacity = 0.90

[font]
size = 10.0

[font.normal]
family = "JetBrains Mono Nerd Font"
# family = "Fira Code Nerd Font Mono"

[scrolling]
history = 100000
multiplier = 3

[env]
TERM = "xterm-256color"

[keyboard]
bindings = [
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "-", mods = "Control", action = "ReceiveChar" },
  { key = "=", mods = "Control", action = "ReceiveChar" },
]

[mouse]
bindings = [{ mouse = "Right", action = "Copy" }]
