[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = true
sort_reverse = false
sort_dir_first = true
linemode = "none"
show_hidden = true
show_symlink = true

[tasks]
image_alloc = 1073741824 # = 1024*1024*1024 = 1024MB
suppress_preload = true

[preview]
cache_dir = "~/.cache/yazi"

[plugin]
prepend_previewers = [
    { mime = "{image,audio,video}/*", run = "mediainfo"},
    { mime = "application/x-subrip", run = "mediainfo"},
]
